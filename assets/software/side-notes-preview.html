<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side Notes</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="title-container">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span class="title">Note Sidebar</span>
        </div>
        <div class="actions">
          <button id="new-note-btn" title="New Note">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <button id="delete-note-btn" title="Delete Note">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="file-selector-container">
        <select id="file-selector">
          <option>Robot testing notes</option>
        </select>
      </div>
    </div>
    
    <div class="editor-container">
      <div class="toolbar">
        <button type="button" class="format-btn" data-command="bold" title="Bold"><b>B</b></button>
        <button type="button" class="format-btn" data-command="italic" title="Italic"><i>I</i></button>
        <button type="button" class="format-btn" data-command="underline" title="Underline"><u>U</u></button>
        <div class="divider"></div>
        <button type="button" class="format-btn" data-command="insertUnorderedList" title="Bullet List">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </button>
        <button type="button" class="format-btn" data-command="insertOrderedList" title="Numbered List">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><path d="M4 6h1v4"></path><path d="M4 10h2"></path><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></svg>
        </button>
        <div class="divider"></div>
        <div class="color-picker-container" title="Text Color">
          <input type="color" id="color-picker" value="#e8eaed">
        </div>
      </div>
      <div id="note-editor" contenteditable="false"><b>Bench test plan</b><div><br></div><div>Check the drivetrain before the next field session.</div><div><br></div><b>Before testing</b><ul><li>Inspect wiring and connectors</li><li>Confirm sensor readings</li><li>Record the starting configuration</li></ul><b>After testing</b><div>Compare the logs with the previous run and note what changed.</div></div>
    </div>
    
    <div class="footer">
      <span id="word-count">Sample content</span>
    </div>
  </div>
  
</body>
</html>
